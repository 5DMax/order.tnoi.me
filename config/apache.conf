<VirtualHost *:80>
 DocumentRoot /var/www/html/public
 <Directory /var/www/html/public>
  AllowOverride None
  Options -Indexes -ExecCGI
  Require all granted
  FallbackResource /index.php
 </Directory>
 <Directory /var/www/html/storage>
  Require all denied
 </Directory>
 <FilesMatch "^\.">
  Require all denied
 </FilesMatch>
 # Exclude query strings to avoid accidental credential logging.
 LogFormat "%a %t \"%m %U %H\" %>s %b" safe
 CustomLog /proc/self/fd/1 safe
 ErrorLog /proc/self/fd/2
 ServerSignature Off
</VirtualHost>
ServerTokens Prod
