services:
  app:
    image: ghcr.io/5dmax/order.tnoi.me:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file: .env
    networks:
      - db-net
      - proxy
    volumes:
      - uploads:/var/www/html/storage/uploads
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
      - traefik.http.routers.${TRAEFIK_ROUTER:?set TRAEFIK_ROUTER}.rule=Host(`${TRAEFIK_HOST:?set TRAEFIK_HOST}`)
      - traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls=true
      - traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?set TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.${TRAEFIK_ROUTER}.service=${TRAEFIK_ROUTER}
      - traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=80
networks:
  db-net:
    external: true
    name: db-net
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK}
volumes:
  uploads:
